[project]
name = "llmbench"
version = "0.1.0"
description = "Open-weight LLM deployment & benchmarking platform (quantization, RAG eval, serving, QLoRA, monitoring)"
readme = "README.md"
authors = [{ name = "Salma Ben Chaouacha" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "huggingface-hub>=0.25",   # GGUF downloads
    "nvidia-ml-py>=12.0",      # VRAM readings (NVML); harmless without a GPU
    "matplotlib>=3.8",         # report figures
    "pypdf>=5.0",              # RAG: PDF text extraction (pure Python, layout mode)
    "fastapi>=0.115",          # serving: OpenAI-compatible API in front of llama-server
    "uvicorn>=0.30",
    "httpx>=0.27",             # async streaming proxy to llama-server
]

# GGUF inference runs in the official llama.cpp server image (Docker, CUDA): no Python
# binding to compile. Heavy, hardware-dependent extras (V2):
#   gpu      -> torch + transformers + bitsandbytes (V2, NVIDIA only)
#   finetune -> peft, trl, datasets, wandb (Phase 5, Colab/Kaggle)
[project.optional-dependencies]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "types-PyYAML>=6.0",
]
load = [
    "locust>=2.31",            # load testing of the API (make load); not in the API image
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmbench"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["pynvml"]  # nvidia-ml-py ships no type stubs
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: loads a real model or service (deselect with -m 'not slow')",
    "gpu: requires an NVIDIA GPU",
]
