# Models, quantization variants and generation parameters.
# Validated by src/llmbench/config.py — run `make config` after any change.
#
# Target machine: laptop RTX 3050, 4 GB VRAM (WSL2 + Docker Desktop).
#   - GGUF variants run through the llama.cpp server (Docker, CUDA)  -> V1, benchmarked locally.
#   - fp16 / bnb_* / awq run through Transformers                      -> V2 (enabled: false).
#     fp16 will be measured on a Kaggle T4: 1.5B in fp16 (~3.1 GB) + KV cache does not fit in 4 GB.
#
# n_gpu_layers: layers offloaded to the GPU (omitted = all). Mistral-7B Q4_K_M (~4.4 GB)
# is larger than the card: its value comes from the offload sweep.

# Shared decoding params: identical for every model so the comparison is fair.
# temperature 0 = greedy decoding -> deterministic, reproducible outputs.
generation:
  temperature: 0.0
  top_p: 1.0
  max_new_tokens: 256
  repetition_penalty: 1.0
  seed: 42

models:
  # Tiny model: CI regression test and smoke tests.
  qwen2.5-0.5b:
    hf_repo: Qwen/Qwen2.5-0.5B-Instruct
    family: qwen2.5
    params_b: 0.5
    context_length: 32768
    variants:
      - quant: gguf_q4_k_m
        repo_id: Qwen/Qwen2.5-0.5B-Instruct-GGUF
        file: qwen2.5-0.5b-instruct-q4_k_m.gguf

  # Main small model; also the QLoRA base model (V2).
  qwen2.5-1.5b:
    hf_repo: Qwen/Qwen2.5-1.5B-Instruct
    family: qwen2.5
    params_b: 1.5
    context_length: 32768
    variants:
      - quant: gguf_q8_0
        repo_id: Qwen/Qwen2.5-1.5B-Instruct-GGUF
        file: qwen2.5-1.5b-instruct-q8_0.gguf
      - quant: gguf_q4_k_m
        repo_id: Qwen/Qwen2.5-1.5B-Instruct-GGUF
        file: qwen2.5-1.5b-instruct-q4_k_m.gguf
      - quant: fp16       # V2 — Kaggle T4
        enabled: false
      - quant: bnb_8bit   # V2
        enabled: false
      - quant: bnb_4bit   # V2
        enabled: false

  # Mid-size, different family (Meta). bartowski's GGUF repo is not gated.
  llama3.2-3b:
    hf_repo: meta-llama/Llama-3.2-3B-Instruct
    family: llama3.2
    params_b: 3.2
    context_length: 131072
    gated: true
    variants:
      - quant: gguf_q8_0
        repo_id: bartowski/Llama-3.2-3B-Instruct-GGUF
        file: Llama-3.2-3B-Instruct-Q8_0.gguf
      - quant: gguf_q4_k_m
        repo_id: bartowski/Llama-3.2-3B-Instruct-GGUF
        file: Llama-3.2-3B-Instruct-Q4_K_M.gguf
      - quant: bnb_4bit   # V2
        enabled: false

  # Largest model: GGUF only, partially offloaded (does not fit in 4 GB).
  mistral-7b:
    hf_repo: mistralai/Mistral-7B-Instruct-v0.3
    family: mistral
    params_b: 7.2
    context_length: 32768
    variants:
      - quant: gguf_q4_k_m
        repo_id: bartowski/Mistral-7B-Instruct-v0.3-GGUF
        file: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
        # Chosen from `make bench-sweep` (results/perf/report.md): all 32 layers give the
        # best decode speed on the RTX 3050 4 GB even though the card is full — the Windows
        # driver spills to shared memory (VRAM reported as a lower bound). Trade-off: the
        # spill doubles time-to-first-token on long prompts versus 24 layers.
        n_gpu_layers: 32
      - quant: awq_int4   # cut: needs > 4 GB VRAM
        enabled: false
